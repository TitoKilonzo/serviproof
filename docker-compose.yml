services:
  postgres:
    image: postgres:16-alpine
    container_name: serviproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: serviproof
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - serviproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serviproof"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  serviproof_pgdata:
